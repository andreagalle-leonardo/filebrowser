# Run using:
#   docker compose up --build

services:
  filebrowser:
    container_name: filebrowser
    build:
      dockerfile: Dockerfile
      context: .
    networks:
      - filebrowser
    environment:
      - REDIS_CACHE_URL=redis://default:filebrowser@redis:6379
      # Modalità Proxy Header: FileBrowser si fida dell'header impostato da oauth2-proxy
      - FB_AUTH_METHOD=proxy
      - FB_AUTH_HEADER=X-Forwarded-Preferred-Username
      - FB_AUTH_LOGOUT_PAGE=http://localhost:8080/oauth2/sign_out?rd=http%3A%2F%2Flocalhost%3A8081%2Frealms%2Fdataplatform%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3Doauth2-proxy%26post_logout_redirect_uri%3Dhttp%3A%2F%2Flocalhost%3A8080
      # Ascolta su tutte le interfacce (non solo localhost) così NGINX può raggiungerlo
      - FB_ADDRESS=0.0.0.0
      - FB_PORT=80
    volumes:
      - filebrowser:/flux/vault
    # Nessuna porta esposta direttamente: raggiungibile solo da NGINX via rete interna
    expose:
      - "80"
    labels:
      - "traefik.enable=false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak-init:
    container_name: keycloak-init
    image: quay.io/keycloak/keycloak:26.0
    networks:
      - filebrowser
    volumes:
      - ./keycloak/init.sh:/opt/keycloak/init.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/init.sh"]
    depends_on:
      keycloak:
        condition: service_healthy
    restart: on-failure # ritenta se kcadm fallisce durante l'inizializzazione

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0
    networks:
      - filebrowser
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Keycloak 26 hostname v2 API:
      # KC_HOSTNAME = hostname che Keycloak pubblica nel discovery doc (front-channel → browser)
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC = le URL back-channel vengono derivate dall'hostname
      #   della request in arrivo → oauth2-proxy chiama http://keycloak:8080 e il discovery
      #   doc ritorna keycloak:8080 per token/userinfo; il browser viene reindirizzato a
      #   localhost:8081 per il login
      - KC_HOSTNAME=http://localhost:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
    # --health-enabled=true: abilita /health/ready (disabilitato di default in start-dev)
    command: start-dev --health-enabled=true
    ports:
      - "8081:8080" # UI Keycloak accessibile dall'host per configurazione
    healthcheck:
      # Keycloak UBI-minimal non ha curl/wget; verifichiamo solo che la porta
      # 8080 accetti connessioni TCP — sufficiente per il depends_on di keycloak-init
      # (che tenta le API con restart: on-failure se non ancora pronto)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 2>/dev/null || exit 1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 10

  oauth2-proxy:
    container_name: oauth2-proxy
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    networks:
      - filebrowser
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      # Back-channel (server→server): discovery e token exchange usano l'hostname interno Docker
      - OAUTH2_PROXY_OIDC_ISSUER_URL=http://keycloak:8080/realms/dataplatform
      # Il token JWT ha iss=localhost:8081 (KC_HOSTNAME); saltiamo il confronto
      # issuer perché discovery avviene su keycloak:8080 ma iss è localhost:8081
      - OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION=true
      - OAUTH2_PROXY_CLIENT_ID=oauth2-proxy
      # Deve corrispondere a CLIENT_SECRET in keycloak/init.sh
      - OAUTH2_PROXY_CLIENT_SECRET=dev-client-secret-filebrowser
      # 32 byte base64-urlsafe — va bene per dev, in produzione: openssl rand -base64 32 | tr -- '+/' '-_' | tr -d '='
      - OAUTH2_PROXY_COOKIE_SECRET=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      # Upstream: il PEP riceve le richieste già autenticate con gli header utente
      - OAUTH2_PROXY_UPSTREAMS=http://pep:8000
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      # Aggiunge X-Forwarded-User/Email/Preferred-Username/Groups alle richieste upstream (proxy mode)
      # SET_XAUTHREQUEST aggiunge headers alla risposta (per nginx auth_request), non all'upstream request
      - OAUTH2_PROXY_PASS_USER_HEADERS=true
      # URL a cui Keycloak redirige il browser dopo il login (porta esterna NGINX)
      - OAUTH2_PROXY_REDIRECT_URL=http://localhost:8080/oauth2/callback
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_COOKIE_SECURE=false # HTTP in dev, true in produzione con HTTPS
      # Whitelist per il redirect rd= usato dal logout verso Keycloak (porta front-channel)
      - OAUTH2_PROXY_WHITELIST_DOMAINS=localhost:8081
    expose:
      - "4180"
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      pep:
        condition: service_healthy
    # Nessun healthcheck: l'immagine oauth2-proxy è distroless (niente shell/wget/curl)
    # nginx usa service_started e aspetta che oauth2-proxy torni risposte valide

  pep:
    container_name: pep
    build:
      dockerfile: Dockerfile
      context: ./pep
    networks:
      - filebrowser
    environment:
      - FILEBROWSER_URL=http://filebrowser:80
      # Futuro: - PDP_URL=http://pdp:8181
    expose:
      - "8000"
    depends_on:
      filebrowser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    container_name: redis
    image: redis:latest
    networks:
      - filebrowser
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >filebrowser ~* +@all
        EOF
        redis-server --aclfile /tmp/users.acl
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://default:filebrowser@localhost:6379", "ping"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    container_name: nginx
    image: nginx:latest
    networks:
      - filebrowser
    ports:
      - 8080:80 # Unico punto di ingresso esposto all'esterno
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      oauth2-proxy:
        condition: service_started

networks:
  filebrowser:

volumes:
  filebrowser:
