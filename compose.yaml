# Run using:
#   docker compose up --build

services:
  filebrowser:
    container_name: filebrowser
    build:
      dockerfile: Dockerfile
      context: .
    networks:
      - filebrowser
    environment:
      - REDIS_CACHE_URL=redis://default:filebrowser@redis:6379
      # Modalità Proxy Header: FileBrowser si fida dell'header X-User-Header
      - FB_AUTH_METHOD=proxy
      - FB_AUTH_HEADER=X-User-Header
      # TODO: sostituire con l'URL reale di Keycloak quando disponibile
      # Formato: https://<keycloak-host>/realms/<realm>/protocol/openid-connect/logout?post_logout_redirect_uri=<redirect>
      - FB_AUTH_LOGOUT_PAGE=http://localhost:8080
      # Ascolta su tutte le interfacce (non solo localhost) così NGINX può raggiungerlo
      - FB_ADDRESS=0.0.0.0
      - FB_PORT=80
    volumes:
      - filebrowser:/flux/vault
    # Nessuna porta esposta direttamente: raggiungibile solo da NGINX via rete interna
    expose:
      - "80"
    labels:
      - "traefik.enable=false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3

  pep:
    container_name: pep
    build:
      dockerfile: Dockerfile
      context: ./pep
    networks:
      - filebrowser
    environment:
      - FILEBROWSER_URL=http://filebrowser:80
      # Futuro: - PDP_URL=http://pdp:8181
    expose:
      - "8000"
    depends_on:
      filebrowser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    container_name: redis
    image: redis:latest
    networks:
      - filebrowser
    command:
      - sh
      - -c
      - |
        cat > /tmp/users.acl <<EOF
        user default on >filebrowser ~* +@all
        EOF
        redis-server --aclfile /tmp/users.acl
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://default:filebrowser@localhost:6379", "ping"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    container_name: nginx
    image: nginx:latest
    networks:
      - filebrowser
    ports:
      - 8080:80 # Unico punto di ingresso esposto all'esterno
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pep:
        condition: service_healthy

networks:
  filebrowser:

volumes:
  filebrowser:
