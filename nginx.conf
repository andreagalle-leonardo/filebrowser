events {}

http {
    upstream oauth2proxy {
        server oauth2-proxy:4180;
    }

    server {
        listen 80;

        # Tutte le richieste passano per oauth2-proxy:
        #   - se non autenticato → redirect login Keycloak
        #   - se autenticato → forwarda al PEP con X-Auth-Request-* header
        location / {
            proxy_pass         http://oauth2proxy;
            proxy_set_header   Host                    $host;
            proxy_set_header   X-Real-IP               $remote_addr;
            proxy_set_header   X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto       $scheme;
            # Necessario per il flusso cookie-based di oauth2-proxy
            proxy_set_header   Cookie                  $http_cookie;

            # oauth2-proxy invia Set-Cookie con la sessione JWT che può
            # superare i 4k di default dei buffer di risposta nginx
            proxy_buffer_size        16k;
            proxy_buffers            8 16k;
            proxy_busy_buffers_size  32k;
        }
    }
}